[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chqce"
version = "0.1.0"
description = "ClickHouse Query Cost Estimator CLI"
requires-python = ">=3.9"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "sqlglot>=20.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
chqce = "chqce.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["chqce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

